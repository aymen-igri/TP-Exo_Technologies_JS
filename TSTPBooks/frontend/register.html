<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Book - TST Books</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <div class="min-h-screen py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md mx-auto bg-white rounded-lg shadow-md p-8">
            <h1 class="text-3xl font-bold text-gray-900 mb-8 text-center">Register New Book</h1>
            
            <form id="bookForm" class="space-y-5">
                <!-- Title -->
                <div>
                    <label for="title" class="block text-sm font-medium text-gray-700">Title *</label>
                    <input 
                        type="text" 
                        id="title" 
                        name="title"
                        required 
                        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                        placeholder="Book title">
                </div>

                <!-- Author -->
                <div>
                    <label for="author" class="block text-sm font-medium text-gray-700">Author *</label>
                    <input 
                        type="text" 
                        id="author" 
                        name="author"
                        required 
                        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                        placeholder="Author name">
                </div>

                <!-- Price -->
                <div>
                    <label for="price" class="block text-sm font-medium text-gray-700">Price *</label>
                    <input 
                        type="number" 
                        id="price" 
                        name="price"
                        step="0.01"
                        required 
                        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                        placeholder="0.00">
                </div>

                <!-- Total Pages -->
                <div>
                    <label for="pageCount" class="block text-sm font-medium text-gray-700">Total Pages *</label>
                    <input 
                        type="number" 
                        id="pageCount" 
                        name="pageCount"
                        required 
                        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                        placeholder="0">
                </div>

                <!-- Pages Read -->
                <div>
                    <label for="pageCountReaded" class="block text-sm font-medium text-gray-700">Pages Read *</label>
                    <input 
                        type="number" 
                        id="pageCountReaded" 
                        name="pageCountReaded"
                        required 
                        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                        placeholder="0">
                    <p class="mt-1 text-xs text-gray-500">Must be less than total pages</p>
                </div>

                <!-- Format -->
                <div>
                    <label for="format" class="block text-sm font-medium text-gray-700">Format *</label>
                    <select 
                        id="format" 
                        name="format"
                        required 
                        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                        <option value="">Select format</option>
                        <option value="Print">Print</option>
                        <option value="PDF">PDF</option>
                        <option value="Ebook">Ebook</option>
                        <option value="AudioBook">AudioBook</option>
                    </select>
                </div>

                <!-- Status -->
                <div>
                    <label for="status" class="block text-sm font-medium text-gray-700">Status *</label>
                    <select 
                        id="status" 
                        name="status"
                        required 
                        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                        <option value="">Select status</option>
                        <option value="Read">Read</option>
                        <option value="Re-read">Re-read</option>
                        <option value="DNF">DNF</option>
                        <option value="Currently reading">Currently reading</option>
                        <option value="Returned Unread">Returned Unread</option>
                        <option value="Want to read">Want to read</option>
                    </select>
                </div>

                <!-- Suggested By -->
                <div>
                    <label for="suggested_by" class="block text-sm font-medium text-gray-700">Suggested By *</label>
                    <input 
                        type="text" 
                        id="suggested_by" 
                        name="suggested_by"
                        required 
                        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                        placeholder="Person who suggested">
                </div>

                <!-- Finished (Hidden, auto-calculated) -->
                <input type="hidden" id="finished" name="finished" value="0">

                <!-- Submit Button -->
                <button 
                    type="submit" 
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-md transition duration-200">
                    Register Book
                </button>

                <!-- Back to Dashboard -->
                <a 
                    href="./tracking.html" 
                    class="block text-center text-blue-600 hover:text-blue-700 text-sm font-medium">
                    Go to Dashboard
                </a>
            </form>

            <!-- Success Message -->
            <div id="successMessage" class="hidden mt-4 p-4 bg-green-100 border border-green-400 text-green-700 rounded">
                Book registered successfully! Redirecting...
            </div>

            <!-- Error Message -->
            <div id="errorMessage" class="hidden mt-4 p-4 bg-red-100 border border-red-400 text-red-700 rounded">
                <p id="errorText"></p>
            </div>
        </div>
    </div>

    <script type="module">
        import { BookService } from './src/services/bookService.ts';

        const form = document.getElementById('bookForm');
        const successMessage = document.getElementById('successMessage');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            try {
                const pageCount = parseInt(document.getElementById('pageCount').value);
                const pageCountReaded = parseInt(document.getElementById('pageCountReaded').value);

                // Validate pages read is less than total pages
                if (pageCountReaded > pageCount) {
                    throw new Error('Pages read cannot be greater than total pages');
                }

                const bookData = {
                    title: document.getElementById('title').value,
                    author: document.getElementById('author').value,
                    price: parseFloat(document.getElementById('price').value),
                    pageCount: pageCount,
                    pageCountReaded: pageCountReaded,
                    format: document.getElementById('format').value,
                    status: document.getElementById('status').value,
                    suggested_by: document.getElementById('suggested_by').value,
                    finished: pageCountReaded === pageCount ? 1 : 0,
                };

                await BookService.createBook(bookData);
                
                successMessage.classList.remove('hidden');
                form.reset();
                
                setTimeout(() => {
                    window.location.href = './tracking.html';
                }, 2000);
            } catch (error) {
                errorMessage.classList.remove('hidden');
                errorText.textContent = error.message || 'An error occurred while registering the book';
            }
        });
    </script>
</body>
</html>

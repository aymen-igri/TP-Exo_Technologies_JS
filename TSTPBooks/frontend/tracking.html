<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading Tracker - TST Books</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="min-h-screen">
        <!-- Header -->
        <nav class="bg-blue-600 text-white shadow-lg">
            <div class="max-w-7xl mx-auto px-4 py-6">
                <div class="flex justify-between items-center">
                    <h1 class="text-3xl font-bold">TST Books - Reading Tracker</h1>
                    <a 
                        href="./register.html" 
                        class="bg-blue-500 hover:bg-blue-700 px-4 py-2 rounded font-bold transition">
                        + Add New Book
                    </a>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <div class="max-w-7xl mx-auto px-4 py-8">
            <!-- Global Statistics -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                <div class="bg-white rounded-lg shadow p-6">
                    <h3 class="text-gray-600 text-sm font-semibold uppercase">Total Books</h3>
                    <p class="text-3xl font-bold text-blue-600 mt-2" id="totalBooks">0</p>
                </div>

                <div class="bg-white rounded-lg shadow p-6">
                    <h3 class="text-gray-600 text-sm font-semibold uppercase">Books Finished</h3>
                    <p class="text-3xl font-bold text-green-600 mt-2" id="booksFinished">0</p>
                </div>

                <div class="bg-white rounded-lg shadow p-6">
                    <h3 class="text-gray-600 text-sm font-semibold uppercase">Total Pages Read</h3>
                    <p class="text-3xl font-bold text-purple-600 mt-2" id="totalPagesRead">0</p>
                </div>

                <div class="bg-white rounded-lg shadow p-6">
                    <h3 class="text-gray-600 text-sm font-semibold uppercase">Total Pages</h3>
                    <p class="text-3xl font-bold text-orange-600 mt-2" id="totalPages">0</p>
                </div>
            </div>

            <!-- Filter and Sort -->
            <div class="bg-white rounded-lg shadow p-4 mb-6">
                <div class="flex flex-col md:flex-row gap-4">
                    <div class="flex-1">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Filter by Status</label>
                        <select id="statusFilter" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500">
                            <option value="">All Status</option>
                            <option value="Read">Read</option>
                            <option value="Re-read">Re-read</option>
                            <option value="DNF">DNF</option>
                            <option value="Currently reading">Currently reading</option>
                            <option value="Returned Unread">Returned Unread</option>
                            <option value="Want to read">Want to read</option>
                        </select>
                    </div>

                    <div class="flex-1">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Sort By</label>
                        <select id="sortBy" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500">
                            <option value="title">Title</option>
                            <option value="author">Author</option>
                            <option value="progress">Progress</option>
                            <option value="status">Status</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Loading State -->
            <div id="loadingState" class="text-center py-12">
                <p class="text-gray-600 font-semibold">Loading books...</p>
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="hidden text-center py-12">
                <p class="text-gray-600 font-semibold mb-4">No books found</p>
                <a href="./register.html" class="text-blue-600 hover:text-blue-700 font-medium">Add your first book</a>
            </div>

            <!-- Books List -->
            <div id="booksList" class="space-y-4">
                <!-- Books will be inserted here -->
            </div>

            <!-- Error State -->
            <div id="errorState" class="hidden">
                <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">
                    <p id="errorMessage"></p>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { BookService } from './src/services/bookService.ts';

        let allBooks = [];

        async function loadBooks() {
            try {
                document.getElementById('loadingState').classList.remove('hidden');
                document.getElementById('errorState').classList.add('hidden');
                
                allBooks = await BookService.getAllBooks();
                
                document.getElementById('loadingState').classList.add('hidden');
                
                if (allBooks.length === 0) {
                    document.getElementById('emptyState').classList.remove('hidden');
                    document.getElementById('booksList').innerHTML = '';
                } else {
                    document.getElementById('emptyState').classList.add('hidden');
                    updateStatistics();
                    renderBooks();
                }
            } catch (error) {
                document.getElementById('loadingState').classList.add('hidden');
                document.getElementById('errorState').classList.remove('hidden');
                document.getElementById('errorMessage').textContent = error.message || 'Failed to load books';
            }
        }

        function updateStatistics() {
            const totalBooks = allBooks.length;
            const booksFinished = allBooks.filter(book => book.finished).length;
            const totalPagesRead = allBooks.reduce((sum, book) => sum + (book.pageCountReaded || 0), 0);
            const totalPages = allBooks.reduce((sum, book) => sum + (book.pageCount || 0), 0);

            document.getElementById('totalBooks').textContent = totalBooks;
            document.getElementById('booksFinished').textContent = booksFinished;
            document.getElementById('totalPagesRead').textContent = totalPagesRead.toLocaleString();
            document.getElementById('totalPages').textContent = totalPages.toLocaleString();
        }

        function getReadingPercentage(book) {
            if (book.pageCount === 0) return 0;
            return Math.round((book.pageCountReaded / book.pageCount) * 100);
        }

        function renderBooks() {
            const statusFilter = document.getElementById('statusFilter').value;
            const sortBy = document.getElementById('sortBy').value;

            let filteredBooks = allBooks;

            if (statusFilter) {
                filteredBooks = filteredBooks.filter(book => book.status === statusFilter);
            }

            // Sort books
            filteredBooks.sort((a, b) => {
                switch (sortBy) {
                    case 'title':
                        return a.title.localeCompare(b.title);
                    case 'author':
                        return a.author.localeCompare(b.author);
                    case 'progress':
                        const progressA = getReadingPercentage(a);
                        const progressB = getReadingPercentage(b);
                        return progressB - progressA;
                    case 'status':
                        return a.status.localeCompare(b.status);
                    default:
                        return 0;
                }
            });

            const booksList = document.getElementById('booksList');
            booksList.innerHTML = filteredBooks.map(book => {
                const percentage = getReadingPercentage(book);
                const isFinished = book.finished || (book.pageCountReaded === book.pageCount);
                
                return `
                    <div class="bg-white rounded-lg shadow p-6">
                        <div class="flex justify-between items-start mb-4">
                            <div class="flex-1">
                                <h3 class="text-xl font-bold text-gray-900">${book.title}</h3>
                                <p class="text-gray-600"><span class="font-semibold">Author:</span> ${book.author}</p>
                                <p class="text-gray-600"><span class="font-semibold">Format:</span> ${book.format}</p>
                                <p class="text-gray-600"><span class="font-semibold">Status:</span> 
                                    <span class="inline-block px-3 py-1 rounded-full text-sm font-semibold ${getStatusBadgeColor(book.status)}">${book.status}</span>
                                </p>
                                <p class="text-gray-600"><span class="font-semibold">Suggested by:</span> ${book.suggested_by}</p>
                                <p class="text-gray-600"><span class="font-semibold">Price:</span> $${book.price.toFixed(2)}</p>
                            </div>
                            <button 
                                onclick="deleteBook('${book._id}')"
                                class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded transition">
                                Delete
                            </button>
                        </div>

                        <!-- Progress Section -->
                        <div class="mt-4">
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-sm font-semibold text-gray-700">Reading Progress</span>
                                <span class="text-sm font-semibold text-gray-700">${percentage}%</span>
                            </div>
                            <div class="w-full bg-gray-200 rounded-full h-3">
                                <div 
                                    class="${isFinished ? 'bg-green-500' : 'bg-blue-500'} h-3 rounded-full transition-all" 
                                    style="width: ${percentage}%">
                                </div>
                            </div>
                            <p class="text-xs text-gray-600 mt-2">${book.pageCountReaded} / ${book.pageCount} pages read</p>
                            ${isFinished ? '<p class="text-xs font-semibold text-green-600 mt-1">✓ Finished</p>' : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function getStatusBadgeColor(status) {
            const colors = {
                'Read': 'bg-green-100 text-green-800',
                'Re-read': 'bg-blue-100 text-blue-800',
                'DNF': 'bg-red-100 text-red-800',
                'Currently reading': 'bg-yellow-100 text-yellow-800',
                'Returned Unread': 'bg-gray-100 text-gray-800',
                'Want to read': 'bg-purple-100 text-purple-800'
            };
            return colors[status] || 'bg-gray-100 text-gray-800';
        }

        window.deleteBook = async function(bookId) {
            if (!confirm('Are you sure you want to delete this book?')) {
                return;
            }

            try {
                await BookService.deleteBook(bookId);
                allBooks = allBooks.filter(book => book._id !== bookId);
                updateStatistics();
                renderBooks();
            } catch (error) {
                alert('Failed to delete book: ' + error.message);
            }
        };

        // Event listeners for filtering and sorting
        document.getElementById('statusFilter').addEventListener('change', renderBooks);
        document.getElementById('sortBy').addEventListener('change', renderBooks);

        // Initial load
        loadBooks();
    </script>
</body>
</html>
